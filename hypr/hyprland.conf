

#Monitor
monitor=,preferred,auto,1

# Startup
exec-once = ~/.config/hypr/scripts/inicio-completo.sh

# Input
input {
    kb_layout = us,es
    kb_variant = ,
    kb_options = grp:alt_shift_toggle

    touchpad {
            natural_scroll = yes
            scroll_factor = 1.2
            disable_while_typing = true

        }
}

# General
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

# Decoration (sin sombras por ahora)
decoration {
    rounding = 10
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

# Keybindings
$mainMod = SUPER

bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, Q, killactive
bind = CTRL SHIFT $mainMod, M, exit
bind = $mainMod, E, exec, pcmanfm


# Rofi - Lanzador universal
bind = $mainMod, U, exec, rofi -show custom -modes "custom:~/scripts/rofi-utils-runner.sh"
bind = ALT, space, exec, rofi -show drun
bind = ALT, R, exec, rofi -show run
bind = ALT, W, exec, rofi -show window
bind = ALT, D, exec, rofi -show combi

# Rofi para scripts personalizados (utilidades)
bind = $mainMod, U, exec, rofi -show custom -modes "custom:~/scripts/rofi-utils.sh"

# Recargar Hyprland (Control + Alt + Shift + R)
bind = CTRL SHIFT, R, exec, hyprctl reload

# Recargar Waybar (Control + Alt + R)
bind = CTRL ALT, R, exec, killall -SIGUSR2 waybar


# Atajos de teclado para wallpapers
bind = $mainMod, W, exec, ~/.config/hypr/scripts/wallpaper-menu.sh   # Menú para elegir
bind = $mainMod, R, exec, ~/.config/hypr/scripts/wallpaper.sh        # Fondo aleatorio

# ================================================
# MOVIMIENTO ENTRE VENTANAS (SUPER + FLECHAS)
# ================================================
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ================================================
# MOVIMIENTO ENTRE WORKSPACES (SUPER + NÚMEROS)
# ================================================
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# ================================================
# MOVER VENTANA A WORKSPACE (SUPER + SHIFT + NÚMERO)
# ================================================
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ================================================
# MOVER VENTANA Y SEGUIRLA (SUPER + CTRL + NÚMERO)
# ================================================
bind = $mainMod CTRL, 1, movetoworkspace, 1
bind = $mainMod CTRL, 2, movetoworkspace, 2
bind = $mainMod CTRL, 3, movetoworkspace, 3
bind = $mainMod CTRL, 4, movetoworkspace, 4
bind = $mainMod CTRL, 5, movetoworkspace, 5
bind = $mainMod CTRL, 6, movetoworkspace, 6
bind = $mainMod CTRL, 7, movetoworkspace, 7
bind = $mainMod CTRL, 8, movetoworkspace, 8
bind = $mainMod CTRL, 9, movetoworkspace, 9
bind = $mainMod CTRL, 0, movetoworkspace, 10

# ================================================
# MOVIMIENTO RÁPIDO ENTRE WORKSPACES (SUPER + , / .)
# ================================================
bind = $mainMod, period, workspace, e+1
bind = $mainMod, comma, workspace, e-1

# ================================================
# CONTROLES DE VENTANA
# ================================================
bind = $mainMod, F, fullscreen, 1          # Pantalla completa
bind = $mainMod, C, centerwindow,          # Centrar ventana
bind = $mainMod, H, resizeactive, -50 0    # Reducir ancho
bind = $mainMod, L, resizeactive, 50 0     # Aumentar ancho
bind = $mainMod, K, resizeactive, 0 -50    # Reducir alto
bind = $mainMod, J, resizeactive, 0 50     # Aumentar alto

# ================================================
# ESPECIALES
# ================================================
bind = $mainMod, Space, togglefloating,    # Flotar/No flotar ventana
bind = $mainMod, P, pseudo,                # Cambiar entre master/stack
bind = $mainMod, Delete, exit,             # Salir de Hyprland

# Control de brillo (F6 y F7)
bindel = , F6, exec, brightnessctl set 5%-
bindel = , F7, exec, brightnessctl set +5%

# Capturas de pantalla
bind = $mainMod, S, exec, grim -g "$(slurp)" ~/Imágenes/Capturas/captura-$(date +%Y%m%d_%H%M%S).png
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy --type image/png


